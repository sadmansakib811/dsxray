[package]
name = "dsxray"
description = "X-ray Apple's .DS_Store files: see every record, every byte, and which file names they leak"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["ds_store", "macos", "finder", "forensics", "parser"]
categories = ["parser-implementations", "command-line-utilities", "filesystem"]

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
plist = { version = "1", default-features = false }
serde_json = "1"
clap = { version = "4", features = ["derive"], optional = true }

[[bin]]
name = "dsxray"
required-features = ["cli"]
